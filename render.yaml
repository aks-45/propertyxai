# ==============================================================
# Render Blueprint Specification for Property X AI
# Deploy Backend, Frontend, and PostgreSQL Database in 1-Click
# ==============================================================

services:
  # ------------------------------------------------------------
  # 1. Express / Node.js Backend Web Service
  # ------------------------------------------------------------
  - type: web
    name: property-x-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: property-x-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false

  # ------------------------------------------------------------
  # 2. Next.js Frontend Web Service
  # ------------------------------------------------------------
  - type: web
    name: property-x-frontend
    runtime: node
    rootDir: .
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: property-x-backend
          property: host
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false

databases:
  # ------------------------------------------------------------
  # 3. Managed PostgreSQL Database
  # ------------------------------------------------------------
  - name: property-x-db
    plan: free
    region: oregon
    databaseName: property_x
    user: property_x_user
